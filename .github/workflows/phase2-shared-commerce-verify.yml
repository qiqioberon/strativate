name: Phase 2 Shared Commerce Verify

on:
  push:
    branches:
      - feat/phase-2-shared-commerce
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SECRET_KEY: test-secret-key
      APP_URL: http://localhost:3000
      MIDTRANS_ENV: sandbox
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: test-midtrans-client-key
      MIDTRANS_SERVER_KEY: test-midtrans-server-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Runtime architecture checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'catalog_products|catalog_commercial_items|catalog_digital_product_details|catalog_offerings|catalog_bundles|public_catalog_' app components lib scripts; then
            echo 'Legacy Product Catalog runtime reference found.' >&2
            exit 1
          fi
          if grep -RIn 'featureFlags\.digitalProducts' app components lib; then
            echo 'Hardcoded Digital Product runtime flag found.' >&2
            exit 1
          fi
          if grep -RInE 'window\.snap\.pay|redirect_url' app components lib; then
            echo 'Non-embedded Midtrans checkout implementation found.' >&2
            exit 1
          fi
          if grep -RIn 'MIDTRANS_SERVER_KEY' app components | grep -v '^app/api/'; then
            echo 'MIDTRANS_SERVER_KEY reference found outside server payment boundary.' >&2
            exit 1
          fi
      - name: Build with Digital Products disabled
        env:
          FEATURE_DIGITAL_PRODUCTS: 'false'
        run: pnpm build
      - name: Build with Digital Products enabled
        env:
          FEATURE_DIGITAL_PRODUCTS: 'true'
        run: |
          rm -rf .next
          pnpm build
      - name: Database bootstrap and SQL tests
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55439/strativate_test_phase2
        run: |
          createdb -h 127.0.0.1 -p 55439 -U postgres strativate_test_phase2
          pnpm test:db -- --bootstrap
      - name: Rebuild disabled storefront for browser suite
        env:
          FEATURE_DIGITAL_PRODUCTS: 'false'
        run: |
          rm -rf .next
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          FEATURE_DIGITAL_PRODUCTS: 'false'
        run: pnpm test:e2e
