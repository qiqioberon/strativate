name: Phase 2A Verify

on:
  push:
    branches:
      - feat/digital-product-domain-admin-crud

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_SECRET_KEY: test-secret-key
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Runtime architecture checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'catalog_products|catalog_commercial_items|catalog_digital_product_details|public_catalog_|CatalogProduct|CatalogCommercialItem' app components lib scripts; then
            echo 'Legacy Product Catalog runtime reference found.' >&2
            exit 1
          fi
          grep -RIn 'digital_products' app components lib scripts supabase/migrations/202609140003_digital_product_domain.sql supabase/tests/digital_products.sql tests
          grep -n 'digitalProducts: false' lib/features.ts
      - name: Build
        run: pnpm build
      - name: Database bootstrap and SQL tests
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55439/strativate_test_phase2a
        run: |
          createdb -h 127.0.0.1 -p 55439 -U postgres strativate_test_phase2a
          pnpm test:db -- --bootstrap
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
